[workspace]
members = ["crates/lean-format", "crates/lean-cli", "bindings/python", "bindings/node"]
resolver = "2"

[workspace.package]
version = "1.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/fiialkod/lean-format"

[workspace.dependencies]
serde_json = { version = "1", features = ["preserve_order", "arbitrary_precision"] }
